# Veröffentlichung auf GitHub Pages, dazu Datums-Version, Git-Tag und Release.
# Vorbild: erfassungsbogen (release.yml) — beide Projekte tragen dasselbe
# Versionsschema, damit eine genannte Nummer überall gleich zu lesen ist.
name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Ein Commit wird genau einmal veröffentlicht. Kam derselbe Push doppelt an,
# liefen sonst zwei vollständige Läufe — und beide wollten dieselbe SHA nach
# Pages deployen. GitHub Pages führt ein Deployment je Commit: das zweite risse
# dem ersten den Platz weg („Deployment cancelled"), die Seite bliebe auf dem
# alten Stand stehen. Der Schlüssel ist bewusst die SHA und nicht der Branch:
# so räumt ein Doppel-Lauf sich selbst weg, während zwei echte Pushes hinter-
# einander unangetastet durchlaufen.
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      build_version: ${{ steps.version.outputs.build_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Build-Version erzeugen
        id: version
        run: |
          # Einheitliches Format YYYY.MMDD.HHMM (z. B. 2026.712.1035): zugleich
          # gültiges SemVer, minutengenau und über Tages-/Jahresgrenzen monoton
          # steigend. Zeitzone ist Europe/Berlin mit Sommer- und Winterzeit, weil
          # die Nummer am Bauort gegen die Uhr an der Wand gehalten wird – eine
          # UTC-Nummer liegt im Sommer zwei Stunden daneben.
          #
          # In der Nacht der Rückstellung läuft die Ortszeit eine Stunde doppelt.
          # Eine Veröffentlichung in diesem Fenster kann deshalb eine Nummer
          # tragen, die kleiner ist als die davor; trifft sie eine schon
          # vergebene Minute, scheitert das Anlegen des Tags und der Lauf bricht
          # ab, statt ein Release zu überschreiben.
          TZ=Europe/Berlin
          export TZ
          Y=$(date +%Y)
          MMDD=$(( 10#$(date +%m) * 100 + 10#$(date +%d) ))
          HHMM=$(( 10#$(date +%H) * 100 + 10#$(date +%M) ))
          echo "build_version=$Y.$MMDD.$HHMM" >> "$GITHUB_OUTPUT"

      - name: Git-Tag anlegen
        env:
          BUILD_VERSION: ${{ steps.version.outputs.build_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$BUILD_VERSION" "$GITHUB_SHA"
          git push origin "$BUILD_VERSION"

  deploy:
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Volle Historie: die Sitemap trägt je Seite das Datum ihrer letzten
          # Änderung, und die kommt aus `git log` der einzelnen Datei. Ein
          # flacher Checkout kennt nur den letzten Commit — dann behauptete
          # jede Seite, am Tag des Deployments geändert worden zu sein, und
          # lastmod wäre wertlos.
          fetch-depth: 0

      - name: Version in die Anwendung schreiben
        env:
          BUILD_VERSION: ${{ needs.prepare.outputs.build_version }}
        run: |
          # Nur im Arbeitsverzeichnis des Laufs, nichts wird zurückgeschrieben:
          # im Repository bleibt „Entwicklungsstand" stehen, ausgeliefert wird
          # die Nummer. Der grep bricht ab, falls die Zeile einmal umbenannt
          # wird — sonst liefe die Ersetzung stillschweigend ins Leere und die
          # veröffentlichte Seite behauptete auf jedem Bauauftrag, sie sei ein
          # Entwicklungsstand.
          grep -q "^export const VERSION = " js/version.js
          sed -i "s|^export const VERSION = .*|export const VERSION = '$BUILD_VERSION';|" js/version.js
          grep "^export const VERSION = " js/version.js

      - name: Änderungsdaten in die Sitemap schreiben
        run: |
          # Wie bei der Version: nur im Arbeitsverzeichnis des Laufs. Im
          # Repository bleibt das zuletzt eingetragene Datum stehen, damit die
          # Datei auch dann stimmt, wenn die Seite einmal ohne Actions direkt
          # aus dem Branch ausgeliefert wird.
          #
          # Textersetzung statt XML-Bibliothek: die Sitemap führt einen
          # begründenden Kommentarkopf, und jede Bibliothek, die den Baum neu
          # schreibt, wirft ihn oder die Formatierung weg.
          python3 - <<'PY'
          import pathlib, re, subprocess, urllib.parse

          def datum(loc):
              pfad = urllib.parse.urlparse(loc).path.lstrip('/')
              # Eine Adresse, die auf / endet, liefert der Server aus index.html —
              # so ist /autor/ zu lesen, und die Startseite / genauso.
              if pfad.endswith('/') or not pfad:
                  pfad += 'index.html'
              # Zuerst die Datei, dann die Historie: `git log` einer gelöschten
              # oder umbenannten Seite liefert weiter ein Datum, nämlich das des
              # Löschens. Ohne diese Prüfung ginge eine tote Adresse mit
              # glaubwürdigem lastmod online — beim Umzug von autor.html nach
              # autor/index.html wäre genau das passiert.
              if not pathlib.Path(pfad).is_file():
                  raise SystemExit(f'{loc} zeigt auf {pfad}, das es nicht gibt — Seite umgezogen?')
              stand = subprocess.run(['git', 'log', '-1', '--format=%cs', '--', pfad],
                                     capture_output=True, text=True, check=True).stdout.strip()
              if not stand:
                  raise SystemExit(f'Kein Änderungsdatum für {pfad} — noch nie committet?')
              print(f'{pfad}: {stand}')
              return stand

          datei = pathlib.Path('sitemap.xml')
          muster = re.compile(r'(<loc>([^<]+)</loc>\s*<lastmod>)[^<]*(</lastmod>)')
          text, anzahl = muster.subn(lambda t: t.group(1) + datum(t.group(2)) + t.group(3),
                                     datei.read_text())
          if not anzahl:
              raise SystemExit('sitemap.xml: kein Paar aus <loc> und <lastmod> gefunden')
          datei.write_text(text)
          PY

      - uses: actions/configure-pages@v5
      - name: Seite hochladen (statisch, kein Build nötig)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    # Erst nach dem Deployment: ein Release soll nur für einen Stand entstehen,
    # der auch wirklich online steht.
    runs-on: ubuntu-latest
    needs: [prepare, deploy]
    steps:
      - name: GitHub Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.build_version }}
          name: ${{ needs.prepare.outputs.build_version }}
          # Ohne Anhänge: die Anwendung ist eine statische Seite, es gibt keine
          # Installationspakete. Das Release ist der Nachweis, welcher Stand
          # wann unter fmbauplaner.app lag.
          generate_release_notes: true
