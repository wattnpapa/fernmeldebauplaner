<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FMBauplaner – Fernmeldebauplanung für das THW</title>
<meta name="description" content="FMBauplaner: GIS-Planungswerkzeug für den Fernmeldebau. Strecken planen, Längen ermitteln, Bauaufträge als PDF ausgeben.">
<link rel="canonical" href="https://fmbauplaner.app/">
<meta name="color-scheme" content="light">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/print.css" media="all">
</head>
<body>

<div id="app">

  <header class="kopf">
    <div class="marke">
      <svg class="marke-zeichen" viewBox="0 0 40 40" aria-hidden="true">
        <rect x="1.5" y="1.5" width="37" height="37" rx="4" fill="#003399"/>
        <path d="M8 27 h4 q2.5 0 2.5 -3.5 Q14.5 18 20 18 q5.5 0 5.5 5.5 Q25.5 27 28 27 h4"
              fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
        <circle cx="12" cy="13" r="2.4" fill="#fff"/><circle cx="28" cy="13" r="2.4" fill="#fff"/>
      </svg>
      <span class="marke-text">FM<span>Bauplaner</span></span>
      <span class="marke-version" id="marke-version" title="Stand der Anwendung"></span>
    </div>

    <div class="kopf-projekt">
      <input id="projektname" class="projektname" type="text" aria-label="Name der Planung" placeholder="Name der Planung">
      <!-- Kein aria-live: die Beschriftung wechselt bei jedem Tastendruck zwischen
           „wird gespeichert …“ und dem Sicherungsstand. Vorlesen ließe das zu einem
           Dauerton werden; Meldungen, die wirklich zählen, laufen über die
           Hinweisbox, die schon eine Live-Region ist. -->
      <button type="button" id="speicherstatus" class="speicherstatus"
              title="Planung als Datei sichern (.json)">gespeichert</button>
    </div>

    <div class="kopf-tasten">
      <button class="knopf" id="btn-hilfe" title="Kurzanleitung" aria-label="Kurzanleitung">?</button>
      <button class="knopf" id="btn-undo" title="Rückgängig (Strg+Z)" aria-label="Rückgängig">↶</button>
      <button class="knopf" id="btn-redo" title="Wiederholen (Strg+Umschalt+Z)" aria-label="Wiederholen">↷</button>
      <div class="menu-halter">
        <button class="knopf" id="btn-datei" aria-haspopup="true" aria-expanded="false">Datei ▾</button>
        <div class="menu" id="menu-datei" hidden>
          <button data-akt="hilfe">Kurzanleitung</button>
          <hr>
          <button data-akt="neu">Neue Planung …</button>
          <button data-akt="oeffnen">Gespeicherte Planungen …</button>
          <hr>
          <button data-akt="export-json">Planung als Datei sichern (.json)</button>
          <button data-akt="import"
                  title="Eigene Planung (.json), GeoJSON sowie KML und KMZ aus Google Earth">Planung oder KML laden …</button>
          <hr>
          <button data-akt="sammel-pdf">Sammel-Bauauftrag aller Strecken (PDF) …</button>
          <hr>
          <button data-akt="export-geojson">Alles als GeoJSON</button>
          <button data-akt="export-gpx">Alles als GPX (Hand-GPS)</button>
          <button data-akt="export-kml">Alles als KML (Google Earth)</button>
          <hr>
          <!-- Echte Links statt Menüknöpfe: Diese Seiten müssen als Adresse
               erreichbar und von außen auffindbar sein. -->
          <a href="autor/" target="_blank" rel="noopener">Über den Autor</a>
          <a href="impressum.html" target="_blank" rel="noopener">Impressum</a>
          <a href="datenschutz.html" target="_blank" rel="noopener">Datenschutz</a>
        </div>
      </div>
    </div>
  </header>

  <p class="speicherband" id="speicherband">
    <span class="sb-text">Diese Planung liegt nur in diesem Browser.</span>
    <span class="sb-stand" id="sb-stand"></span>
    <button type="button" class="knopf klein" id="sb-sichern">Als Datei sichern</button>
  </p>

  <div class="hauptbereich">

    <aside class="seite" id="seite">
      <nav class="reiter" role="tablist">
        <button role="tab" class="aktiv" aria-selected="true" data-reiter="strecken">Strecken</button>
        <button role="tab" aria-selected="false" data-reiter="zeichen">Taktische Zeichen</button>
        <button role="tab" aria-selected="false" data-reiter="projekt">Planung</button>
      </nav>

      <section class="reiter-inhalt aktiv" data-inhalt="strecken">
        <div class="seite-kopf">
          <button class="knopf primaer breit" id="btn-neue-strecke">+ Neue Strecke zeichnen</button>
          <div class="seite-kopf-zeile">
            <button class="knopf klein" id="btn-neuer-abschnitt"
                    title="Strecken in Zuständigkeiten gliedern">+ Einsatzabschnitt</button>
            <button class="knopf klein" id="btn-sammel-pdf">▤ Sammel-PDF (alle Strecken)</button>
          </div>
        </div>
        <div class="summe" id="strecken-summe"></div>
        <div class="liste" id="strecken-liste"></div>
      </section>

      <section class="reiter-inhalt" data-inhalt="zeichen">
        <div class="seite-kopf">
          <button class="knopf primaer breit" id="btn-neues-zeichen">+ Taktisches Zeichen setzen</button>
        </div>
        <div class="liste" id="zeichen-liste"></div>
      </section>

      <section class="reiter-inhalt" data-inhalt="projekt">
        <div class="feldgruppe" id="projekt-kopf"></div>
        <div class="feldgruppe" id="projekt-speicher"></div>
        <div class="feldgruppe" id="projekt-ueber"></div>
      </section>
    </aside>

    <main class="kartenbereich">
      <div id="karte" role="application" aria-label="Planungskarte"></div>

      <div class="werkzeuge" role="toolbar" aria-label="Werkzeuge">
        <!-- Das Tastenkürzel steht sichtbar in der Beschriftung, nicht nur im
             title: den zeigt kein Touchgerät, und wer am Schreibtisch plant,
             lernt es nur, wenn es dasteht. -->
        <button class="wz" id="wz-strecke" title="Strecke zeichnen (S)"><span class="wz-icon">╱</span><span>Strecke<i class="wz-taste">S</i></span></button>
        <button class="wz" id="wz-zeichen" title="Taktisches Zeichen setzen (T)"><span class="wz-icon">◈</span><span>Zeichen<i class="wz-taste">T</i></span></button>
        <button class="wz" id="wz-suche" title="Koordinate anspringen (K)"><span class="wz-icon">⌖</span><span>Koordinate<i class="wz-taste">K</i></span></button>
        <button class="wz" id="wz-standort" title="Eigenen Standort anzeigen"><span class="wz-icon">◎</span><span>Standort</span></button>
      </div>

      <div class="zeichen-hinweis" id="zeichen-hinweis" hidden>
        <span class="zh-text"></span>
        <button class="knopf klein" data-akt="zurueck">Letzten Punkt zurück</button>
        <button class="knopf klein primaer" data-akt="fertig">Fertig (Enter)</button>
        <button class="knopf klein" data-akt="abbruch">Abbrechen (Esc)</button>
      </div>

      <div class="kartenoptionen">
        <label class="ko-zeile"><span>Karte</span>
          <select id="basiskarte"></select>
        </label>
        <label class="ko-zeile ko-haken"><input type="checkbox" id="opt-teillaengen"><span>Teillängen</span></label>
        <label class="ko-zeile ko-haken"><input type="checkbox" id="opt-gesamtlaenge"><span>Streckenname &amp; Summe</span></label>
        <label class="ko-zeile ko-haken"><input type="checkbox" id="opt-punktnummern"><span>Punktnummern</span></label>
        <label class="ko-zeile"><span>Zeichengröße</span>
          <input type="range" id="opt-symbolgroesse" min="0.6" max="1.8" step="0.1">
        </label>
      </div>

      <div class="statusleiste">
        <button type="button" class="sl-koord sl-kopie" id="sl-mgrs-kopie" title="MGRS-Gitterangabe kopieren">
          <span class="sl-titel">MGRS</span><span class="sl-wert mono" id="sl-mgrs">–</span>
        </button>
        <button type="button" class="sl-koord sl-kopie" id="sl-gps-kopie" title="GPS-Koordinate kopieren">
          <span class="sl-titel">GPS</span><span class="sl-wert mono" id="sl-gps">–</span>
        </button>
        <div class="sl-koord sl-dez">
          <span class="sl-titel">Dezimal</span><span class="sl-wert mono" id="sl-dez">–</span>
        </div>
        <div class="sl-quelle" id="sl-quelle">Karte antippen für die Koordinate</div>
      </div>
    </main>

    <nav class="ansicht-wechsel" id="ansicht-wechsel" aria-label="Ansicht wechseln">
      <button type="button" class="aw aktiv" id="aw-liste" aria-pressed="true">Liste</button>
      <button type="button" class="aw" id="aw-karte" aria-pressed="false">Karte</button>
    </nav>

  </div>
</div>

<input type="file" id="datei-import" hidden
       accept=".json,.geojson,.kml,.kmz,application/json,application/vnd.google-earth.kml+xml,application/vnd.google-earth.kmz">

<div class="dialog-huelle" id="dialog" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-titel">
    <header class="dialog-kopf">
      <h2 id="dialog-titel"></h2>
      <button class="knopf klein" data-akt="dialog-zu" aria-label="Schließen">✕</button>
    </header>
    <div class="dialog-inhalt" id="dialog-inhalt"></div>
    <footer class="dialog-fuss" id="dialog-fuss"></footer>
  </div>
</div>

<div class="hinweisbox" id="hinweisbox" role="status" aria-live="polite" hidden></div>

<script src="vendor/leaflet/leaflet.js"></script>
<script type="module" src="js/app.js"></script>

<!-- Reichweitenmessung ohne Cookies und ohne personenbezogene Daten (GoatCounter).
     Blockiert der Browser das Skript, läuft die Anwendung unverändert weiter. -->
<script data-goatcounter="https://fmbauplaner.goatcounter.com/count"
        async src="https://gc.zgo.at/count.js"></script>
<noscript><p style="padding:2rem;font:16px system-ui">Für den FMBauplaner wird JavaScript benötigt.</p></noscript>
</body>
</html>
